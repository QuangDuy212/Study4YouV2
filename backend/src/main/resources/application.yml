spring:
  application:
    name: study4you-backend
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Global API versioning prefix
  mvc:
    servlet:
      path: /api/v1
  
  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/study4you?TimeZone=Asia/Ho_Chi_Minh
    username: study4you_user
    password: 1012004
    driver-class-name: org.postgresql.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: Study4YouSecretKeyForJWTTokenGenerationMustBeLongEnough2024
  access-token-expiration: 3600000      # 1 hour in milliseconds
  refresh-token-expiration: 86400000    # 24 hours in milliseconds

# Logging Configuration
logging:
  level:
    com.study4you: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Gemini AI Configuration
# Set env var GEMINI_API_KEY to enable real AI generation.
# If empty, AiService falls back to built-in mock data.
gemini:
  api-key: AIzaSyCE0F0vf37hrSOEYDtUcvP9CfNCoBdd7zM
  model: gemini-2.0-flash

